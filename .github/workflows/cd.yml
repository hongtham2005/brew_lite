name: CD (Deploy & Smoke Test)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  deploy-production:
    name: Deploy to Render & Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Trigger Deploy lên Render qua Webhook
      - name: Trigger Render Deployment
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "Triggered Render deployment successfully."
          else
            echo "Missing RENDER_DEPLOY_HOOK secret"
            exit 1
          fi


      - name: Smoke Test (Health Check)
        run: |
          echo "Waiting for Render to build, run migration, and start the service..."
          URL="https://brewlite-api-jac6.onrender.com/health"
          MAX_RETRIES=20
          DELAY=15
          
          for ((i=1; i<=MAX_RETRIES; i++)); do
            echo "Attempt $i/$MAX_RETRIES: Checking $URL..."
            response=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            
            if [ "$response" -eq 200 ]; then
              echo "✅ Smoke test passed! /health returned 200 OK."
              exit 0
            fi
            
            echo "⏳ Service is still starting up (status: $response). Retrying in ${DELAY}s..."
            sleep $DELAY
          done
          
          echo "❌ Smoke test failed: Service did not become ready after $((MAX_RETRIES * DELAY)) seconds."
          exit 1