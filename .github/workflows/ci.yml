name: CI

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================== BACKEND ====================
  backend:
    name: Backend (Lint → Test → Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          # Chỉ cần để generate, không cần DB thật
          DATABASE_URL: "postgresql://build:build@localhost:5432/build?schema=public"

      - name: Lint
        run: npm run lint

      - name: Unit Test
        run: npm test -- --passWithNoTests
        # --passWithNoTests để không fail nếu chưa có test (Sprint 1)

      - name: Build
        run: npm run build

  # ==================== FRONTEND ====================
  frontend:
    name: Frontend (Lint → Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Frontend hiện chưa có script test → tạm thời bỏ qua hoặc thêm test sau
      # - name: Unit Test
      #   run: npm test -- --passWithNoTests

      - name: Build
        run: npm run build
        env:
          # Tránh lỗi thiếu env khi build Next.js
          NEXT_PUBLIC_API_URL: "http://localhost:3001"