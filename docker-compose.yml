# Task 1 + 9: Chạy đồng thời 3 services (DB, Backend, Frontend)
services:
  # 1. Database PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: brewlite_db
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-brewlite}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-brewlite}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend NestJS API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brewlite_backend
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-brewlite}?schema=public
      PORT: 3001
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy # Chỉ chạy Backend sau khi DB đã sẵn sàng nhận kết nối

  # 3. Frontend Next.js Web App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: brewlite_frontend
    restart: always
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local