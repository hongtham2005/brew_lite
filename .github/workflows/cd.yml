name: CD (Deploy & Smoke Test)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  deploy-production:
    name: Deploy to Render & Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Trigger Deploy lên Render qua Webhook
      - name: Trigger Render Deployment
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "Triggered Render deployment successfully."
          else
            echo "Missing RENDER_DEPLOY_HOOK secret"
            exit 1
          fi

      # 2. Smoke Test / Health Check sau khi deploy (Đợi Render build xong)
      - name: Smoke Test (Health Check)
        run: |
          echo "Waiting for Render to build and start the service..."
          sleep 45
          # Lưu ý: Nếu app của bạn có set global prefix là 'api', hãy đổi thành /api/health
          response=$(curl -s -o /dev/null -w "%{http_code}" https://brewlite-api-5ec6.onrender.com/health)
          if [ "$response" -eq 200 ]; then
            echo "Smoke test passed! /health returned 200 OK."
          else
            echo "Smoke test failed with status code: $response"
            exit 1
          fi